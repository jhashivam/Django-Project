<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title description">
  <title id="title">Django Project by Shivam Jha</title>
  <desc id="description">A dark green and navy banner celebrating a Django web development project.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101c2c"/>
      <stop offset="1" stop-color="#172b35"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#44b78b"/>
      <stop offset="1" stop-color="#8bd6a3"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="420" rx="28" fill="url(#background)"/>
  <circle cx="1030" cy="90" r="190" fill="#44b78b" opacity=".08"/>
  <circle cx="1110" cy="355" r="145" fill="#8bd6a3" opacity=".07"/>
  <path d="M0 338c180-65 287 38 448-5s258-72 408-18 236 28 344-7v112H0z" fill="#44b78b" opacity=".08"/>
  <g transform="translate(82 95)">
    <rect width="72" height="72" rx="18" fill="url(#accent)"/>
    <path d="M42 13h20v42c0 18-11 28-29 28-9 0-17-2-23-6l7-15c4 3 9 4 14 4 8 0 11-4 11-12z" fill="#10242a"/>
    <text x="0" y="126" fill="#a5bac1" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="3">WEB DEVELOPMENT</text>
    <text x="0" y="207" fill="#f3f7f5" font-family="Segoe UI, Arial, sans-serif" font-size="64" font-weight="700" letter-spacing="-2">Django Project</text>
    <rect x="2" y="232" width="54" height="4" rx="2" fill="url(#accent)"/>
    <text x="0" y="276" fill="#b5c5c6" font-family="Segoe UI, Arial, sans-serif" font-size="25">by Shivam Jha</text>
  </g>
  <g transform="translate(793 115)">
    <rect width="300" height="196" rx="16" fill="#0b151e" stroke="#35515a" stroke-width="2"/>
    <path d="M0 48h300" stroke="#35515a" stroke-width="2"/>
    <circle cx="24" cy="24" r="5" fill="#ff746f"/>
    <circle cx="44" cy="24" r="5" fill="#f4c66b"/>
    <circle cx="64" cy="24" r="5" fill="#62c998"/>
    <g font-family="Consolas, 'Courier New', monospace" font-size="15">
      <text x="25" y="87" fill="#91a8ad">from</text>
      <text x="67" y="87" fill="#8bd6a3">django</text>
      <text x="124" y="87" fill="#91a8ad">import</text>
      <text x="25" y="113" fill="#8bd6a3">views</text>
      <text x="25" y="153" fill="#d2e0dc">def</text>
      <text x="59" y="153" fill="#f4c66b">home</text>
      <text x="105" y="153" fill="#d2e0dc">(request):</text>
      <text x="46" y="179" fill="#91a8ad">return</text>
      <text x="96" y="179" fill="#8bd6a3">render</text>
      <text x="149" y="179" fill="#d2e0dc">(request, ...)</text>
    </g>
  </g>
  <text x="1090" y="370" text-anchor="end" fill="#7e999d" font-family="Segoe UI, Arial, sans-serif" font-size="14" letter-spacing="2">BUILT WITH DJANGO</text>
